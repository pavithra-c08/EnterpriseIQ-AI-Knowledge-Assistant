server {
    listen 80;

    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Block hidden files (.env, .git, etc.)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Block sensitive backup and configuration files
    location ~* \.(env|bak|backup|sql|zip|tar|gz|tgz|old|conf)$ {
        return 404;
    }

    # Block common sensitive endpoints
    location ~* ^/(phpinfo\.php|server-status|actuator|swagger|swagger-ui|api-docs) {
        return 404;
    }

    # React Frontend
    location / {
        try_files $uri $uri/ /index.html;
    }

    # FastAPI Backend
    location /api/ {
        proxy_pass http://backend:8000/;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    error_page 500 502 503 504 /50x.html;

    location = /50x.html {
        root /usr/share/nginx/html;
    }

    # Hide Nginx version
    server_tokens off;
}