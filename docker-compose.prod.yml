services:
  postgres:
    image: postgres:17
    container_name: enterpriseiq-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234
      POSTGRES_DB: enterprise_rag

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d enterprise_rag"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: dinanki/enterprise-rag-backend:latest
    container_name: enterpriseiq-backend
    restart: unless-stopped

    env_file:
      - ./app/.env

    ports:
      - "8000:8000"

    volumes:
      - uploads_data:/app/uploads
      - vector_db_data:/app/vector_db

    depends_on:
      postgres:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  frontend:
    image: dinanki/enterprise-rag-frontend:latest
    container_name: enterpriseiq-frontend
    restart: unless-stopped

    ports:
      - "80:80"

    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  uploads_data:
  vector_db_data:
